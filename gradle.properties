org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Pin the Kotlin compile daemon's JVM args so every Gradle invocation (Android
# Studio AND command line) reuses the SAME daemon instead of spawning competing
# ones. Competing daemons race on the KSP/Hilt output dir and fail with
# "failed to make parent directories".
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Build cache DISABLED intentionally. With KSP + Hilt on Windows this project
# repeatedly served STALE generated Dagger code from the cache after DI/source
# changes (e.g. a @HiltViewModel constructor change → DaggerFactoryOpsApp kept the
# old constructor → NoSuchMethodError / ClassNotFoundException at launch). Slower
# builds are worth the correctness. Do NOT flip back to true.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
