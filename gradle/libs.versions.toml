[versions]
agp                         = "8.6.1"
kotlin                      = "2.0.21"
ksp                         = "2.0.21-1.0.27"
coreKtx                     = "1.13.1"
lifecycle                   = "2.8.6"
activityCompose             = "1.9.2"
composeBom                  = "2024.09.03"
navigationCompose           = "2.8.1"
hilt                        = "2.52"
hiltExt                     = "1.2.0"
room                        = "2.6.1"
retrofit                    = "2.11.0"
okhttp                      = "4.12.0"
kotlinxSerialization        = "1.7.2"
retrofitKotlinxConverter    = "1.0.0"
workManager                 = "2.9.1"
securityCrypto              = "1.1.0-alpha06"
firebaseBom                 = "33.3.0"
coil                        = "2.7.0"
cameraX                     = "1.3.4"
kotlinxDatetime             = "0.6.1"
coroutines                  = "1.8.1"
desugar                     = "2.0.4"
junit5                      = "5.11.0"
mockk                       = "1.13.12"
turbine                     = "1.1.0"
junitExt                    = "1.2.1"
espresso                    = "3.6.1"

[libraries]
core-ktx                    = { group = "androidx.core",              name = "core-ktx",                               version.ref = "coreKtx" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",                 version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",           version.ref = "lifecycle" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",             version.ref = "lifecycle" }
activity-compose            = { group = "androidx.activity",          name = "activity-compose",                      version.ref = "activityCompose" }

compose-bom                 = { group = "androidx.compose",           name = "compose-bom",                           version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",        name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons      = { group = "androidx.compose.material",  name = "material-icons-extended" }
compose-ui-tooling          = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",                    version.ref = "navigationCompose" }

hilt-android                = { group = "com.google.dagger",          name = "hilt-android",                          version.ref = "hilt" }
hilt-android-compiler       = { group = "com.google.dagger",          name = "hilt-android-compiler",                 version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",              name = "hilt-navigation-compose",               version.ref = "hiltExt" }
hilt-work                   = { group = "androidx.hilt",              name = "hilt-work",                             version.ref = "hiltExt" }
hilt-compiler               = { group = "androidx.hilt",              name = "hilt-compiler",                         version.ref = "hiltExt" }

room-runtime                = { group = "androidx.room",              name = "room-runtime",                          version.ref = "room" }
room-ktx                    = { group = "androidx.room",              name = "room-ktx",                              version.ref = "room" }
room-compiler               = { group = "androidx.room",              name = "room-compiler",                         version.ref = "room" }

retrofit                    = { group = "com.squareup.retrofit2",      name = "retrofit",                              version.ref = "retrofit" }
okhttp                      = { group = "com.squareup.okhttp3",        name = "okhttp",                                version.ref = "okhttp" }
okhttp-logging              = { group = "com.squareup.okhttp3",        name = "logging-interceptor",                   version.ref = "okhttp" }
retrofit-kotlinx-converter  = { group = "com.jakewharton.retrofit",   name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxConverter" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",      name = "kotlinx-serialization-json",            version.ref = "kotlinxSerialization" }

work-runtime-ktx            = { group = "androidx.work",              name = "work-runtime-ktx",                      version.ref = "workManager" }
security-crypto             = { group = "androidx.security",           name = "security-crypto",                       version.ref = "securityCrypto" }

firebase-bom                = { group = "com.google.firebase",        name = "firebase-bom",                          version.ref = "firebaseBom" }
firebase-messaging          = { group = "com.google.firebase",        name = "firebase-messaging-ktx" }

coil-compose                = { group = "io.coil-kt",                 name = "coil-compose",                          version.ref = "coil" }

camera-camera2              = { group = "androidx.camera",            name = "camera-camera2",                        version.ref = "cameraX" }
camera-lifecycle            = { group = "androidx.camera",            name = "camera-lifecycle",                      version.ref = "cameraX" }
camera-view                 = { group = "androidx.camera",            name = "camera-view",                           version.ref = "cameraX" }

kotlinx-datetime            = { group = "org.jetbrains.kotlinx",      name = "kotlinx-datetime",                      version.ref = "kotlinxDatetime" }
coroutines-android          = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",            version.ref = "coroutines" }
coroutines-core             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-core",               version.ref = "coroutines" }
coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",               version.ref = "coroutines" }

desugar-jdk                 = { group = "com.android.tools",          name = "desugar_jdk_libs",                      version.ref = "desugar" }

junit5-api                  = { group = "org.junit.jupiter",          name = "junit-jupiter-api",                     version.ref = "junit5" }
junit5-engine               = { group = "org.junit.jupiter",          name = "junit-jupiter-engine",                  version.ref = "junit5" }
junit5-params               = { group = "org.junit.jupiter",          name = "junit-jupiter-params",                  version.ref = "junit5" }
mockk                       = { group = "io.mockk",                   name = "mockk",                                 version.ref = "mockk" }
turbine                     = { group = "app.cash.turbine",           name = "turbine",                               version.ref = "turbine" }
junit-ext                   = { group = "androidx.test.ext",          name = "junit",                                 version.ref = "junitExt" }
espresso-core               = { group = "androidx.test.espresso",     name = "espresso-core",                         version.ref = "espresso" }

[plugins]
android-application         = { id = "com.android.application",                   version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android",               version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",        version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",  version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android",             version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
google-services             = { id = "com.google.gms.google-services",             version = "4.4.2" }
